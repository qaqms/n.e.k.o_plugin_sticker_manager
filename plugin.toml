[plugin]
id = "sticker_manager"
name = "表情包管理"
description = "给她一个自己的表情包收藏间：你在面板里收藏、写描述、打标签，她在对话里自己挑一张发出去。支持 png/jpg/gif/webp，动图保留动画；每次发送都记台账，面板能看到她最近爱用什么、哪张想发却没发出去。"
short_description = "表情包收藏与发送：面板管理库，猫娘通过工具自主挑图发到聊天"
keywords = [
    "表情包",
    "贴纸",
    "收藏",
    "聊天",
    "图片",
    "sticker",
    "meme",
    "gallery",
]
version = "0.7.1"
type = "plugin"
entry = "plugin.plugins.sticker_manager:StickerManagerPlugin"

[plugin.author]
name = "qaqms"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "表情包管理"
entry = "ui/panel.tsx"
context = "dashboard"
# state:read 读目录快照；config:read 读当前配置形状；action:call 才能点按钮。
# 写库不经过 config 通道（走 entry），所以不声明 config:write。
permissions = ["state:read", "config:read", "action:call"]

[plugin_runtime]
enabled = true
# 随宿主自动启动：她的工具（sticker_list / sticker_send）要在对话里随时可用。
# 知情同意由总开关 [sticker_manager].enabled = false（fail-closed）保证——
# 未显式打开前她不发图、看不到目录，管理入口仍可用。
auto_start = true

# ---------------------------------------------------------------------------
# 业务配置。这里的值是「默认值」；用户在 <用户数据根>/plugins/sticker_manager/
# config/plugin.toml 里的覆盖层优先。config.example.toml 是同一份形状的镜像
# （那份不含任何 [plugin*] 表）。core/configuration.py 的 dataclass 默认值是
# 第三个来源——三处由 tests/test_config_docs_sync.py 钉死同源。
# ---------------------------------------------------------------------------

[sticker_manager]
# fail-closed 总开关：false = 她不发图、看不到目录；库的增删改不受影响。
enabled = false

[sticker_manager.send]
# 同一角色卡两次发送之间的最小间隔（秒）。防刷屏，也防模型连着甩图。
cooldown_sec = 20.0
# 静态图走内联通道的字节上限；超过改走宿主上传换 URL（gif 例外：
# 上传会把动图压平成 JPEG，动图内联不下就如实拒绝）。
inline_max_bytes = 262144
# 是否允许动图也走上传通道（代价：动画被压平）。默认关闭。
animated_via_upload = false
# 跨轮去重（轮 D①）：她自主选图时，同一角色卡最近 N 张成功发过的不再出现
# （query 候选剔除；显式 id 拦下，主人点名要重看用 force 绕行）。0 = 关闭。
# 数据源是持久台账——与冷却（内存表）不同，"最近发过什么"是事实记忆。
recent_dedup_count = 5
# 概率闸门（轮 D②）：她想发图时按此概率放行，未中则该轮回落纯文字。
# 1.0 = 关闭。默认关：闸门会拒绝她已下的决定，属行为干预，主人显式打开才生效。
probability = 1.0
# 同一角色卡一次掷骰的复用窗口（秒）：同一轮里二次定夺不重掷（防 p²）。
probability_reuse_sec = 60.0

[sticker_manager.storage]
# 给模型看的目录最多列几条（按最近使用排序）。
catalog_limit_for_model = 80
# 使用台账保留多少条。
usage_history_keep = 200

[sticker_manager.awareness]
# 存在感注入：低频把「你有一间表情收藏间 + 最近常用的几张」静默注进她的上下文
# （visibility=[]，用户看不见；ai_behavior="read"，不起话轮）。
# 与总开关是「与」的关系：[sticker_manager].enabled=false 时这里全不生效。
enabled = true
# 同一角色卡两次注入的最小间隔（秒）。默认一小时——没有真机基线前刻意保守。
interval_sec = 3600.0
# 注入文本里"最近常用"最多带几行。
max_recent_lines = 5
